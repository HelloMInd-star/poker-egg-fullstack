# .github/workflows/deploy.yml
# 前端构建并发布到 GitHub Pages（可选，建议优先使用 Vercel 自动部署）
#
# 注意：
#  - GitHub Pages 只托管静态文件，API/WS 必须单独部署后端（Railway/Render 等）
#  - API/WS 地址已写入 frontend/.env.production（地址公开无敏感信息），构建时自动加载
#
# Vercel 部署方式（推荐）：在 Vercel 导入本仓库，Root Directory 设为 frontend/，
# 在 Project Settings 填好上述环境变量即可，无需此 workflow。

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 需要创建/覆盖 gh-pages 分支
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install and Build Frontend
        working-directory: frontend
        run: |
          npm install
          # GitHub Pages 项目页路径前缀；同时注入 API/WS URL（如配置了 secret 则使用，否则留空走相对路径）
          VITE_BASE_PATH=/poker-egg-fullstack/ npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
