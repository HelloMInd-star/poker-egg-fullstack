# .github/workflows/deploy.yml
# 部署前端到 GitHub Pages（构建 frontend/dist 并发布到 gh-pages）
# 注意：GitHub Pages 仅托管静态文件，API 和 WebSocket 需要单独部署后端服务
#       部署后需要在前端配置中设置正确的 VITE_API_URL 和 VITE_WS_URL 指向你的后端地址

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          # 设置 GitHub Pages 的 base 路径
          VITE_BASE_PATH=/poker-egg-fullstack/ npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
